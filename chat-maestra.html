<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Profesora Virtual</title>
    <link rel="stylesheet" href="chat-maestra.css" />
  </head>
  <body>
    <div class="chat-container">
      <section id="chat-widget" class="chat-widget" aria-label="Chat Educativo">
        <div class="chat-header-mini">
          <div class="titulo">👩‍🏫 <span>Profesora Virtual</span></div>
        </div>
        <div id="estado-conexion" class="estado-conexion">
          <span class="icono">🔄</span>
          <span class="texto">Preparando nuestra charla...</span>
        </div>
        <div id="chat-mensajes"></div>
        <div class="chat-input-bar">
          <textarea id="chat-input" placeholder="Escribe tu mensaje…"></textarea>
          <button id="btn-enviar" aria-label="Enviar">➤</button>
        </div>
        <div class="controles-adicionales">
          <button class="btn-control" id="btn-nueva-sesion">🔄 Nueva Conversación</button>
        </div>
      </section>
    </div>

    <script src="profesora-virtual.js"></script>
    <script src="chat-educativo.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const widget = document.getElementById('chat-widget');
        widget.classList.add('abierto');

        const chat = new ChatEducativo();
        try {
          await chat.inicializar();
        } catch (error) {
          console.error('No se pudo iniciar el chat educativo', error);
        }
      });
    </script>
  </body>
</html>
